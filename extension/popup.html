<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body {
    width: 300px; margin: 0; padding: 16px;
    font: 14px/1.5 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: #16181D; background: #F7F6F2;
  }
  .brand { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
  .brand span { color: #2245C7; }
  .sub { font-size: 12px; color: #6E7178; margin-bottom: 14px; }
  .status { font-size: 13px; padding: 10px 12px; background: #fff; border: 1px solid #E4E2DB; border-radius: 10px; margin-bottom: 10px; }
  .status b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #6E7178; margin-bottom: 4px; font-weight: 600; }
  .conf { font-size: 12px; padding: 8px 11px; border-radius: 9px; margin-bottom: 10px; border: 1px solid transparent; }
  .conf b { display: block; font-weight: 600; margin-bottom: 2px; }
  .conf-high { background: #ECF7F0; border-color: #1D6E3A33; color: #1D6E3A; }
  .conf-medium { background: #FDF4E3; border-color: #B06E0833; color: #8A5606; }
  .conf-low { background: #FBECEB; border-color: #A8231C33; color: #8E1E18; }
  #layers { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 11px; color: #6E7178; margin-bottom: 12px; font-family: 'IBM Plex Mono', monospace; }
  #layers span { text-transform: uppercase; letter-spacing: .05em; }
  #layers em { font-style: normal; color: #16181D; }
  button {
    width: 100%; padding: 11px 0; border: none; border-radius: 999px;
    background: #2245C7; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer;
    transition: transform .2s, box-shadow .2s;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(34,69,199,.3); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #6E7178; font-weight: 600; margin: 14px 0 5px; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #E4E2DB; border-radius: 8px; font: 12px 'IBM Plex Mono', monospace; }
  .hint { font-size: 11px; color: #6E7178; margin-top: 10px; }
  @media (prefers-reduced-motion: reduce) { button { transition: none } button:hover { transform: none } }
</style>
</head>
<body>
  <div class="brand">lowballer<span>.com</span></div>
  <div class="sub">Appraise the listing in this tab</div>
  <div class="status"><b>Detected</b><span id="detail">Checking page…</span></div>
  <div class="conf" id="conf"></div>
  <div id="layers"></div>
  <button id="go" disabled>Lowball this</button>
  <label for="base">Site URL</label>
  <input id="base" type="url" placeholder="https://lowballer.com" />
  <div class="hint">Set to http://localhost:3000 while developing.</div>
  <script src="popup.js"></script>
</body>
</html>
